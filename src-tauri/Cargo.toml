[package]
name = "eternal-chat"
version = "0.1.0"
description = "Eternal Chat desktop shell"
authors = ["Eternal Chat contributors"]
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "eternal_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
serde_json = "=1.0.151"
